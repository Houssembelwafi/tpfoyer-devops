apiVersion: apps/v1
kind: Deployment
metadata:
  name: houcem-tpfoyer-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: houcem-tpfoyer
  template:
    metadata:
      labels:
        app: houcem-tpfoyer
    spec:
      containers:
        - name: houcem-tpfoyer
          image: houssembwfi/tpfoyer-devops:latest
          ports:
            - containerPort: 8089
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://houcem-mysql-service:3306/db?createDatabaseIfNotExist=true
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: root
            - name: SERVER_PORT
              value: "8089"
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: /tpfoyer
          # readinessProbe:
          #   httpGet:
          #     path: /tpfoyer/actuator/health (ki tzid actuator/prometheus dependency jarabha)
          #     port: 8089
          #   initialDelaySeconds: 30
          #   periodSeconds: 6

---
apiVersion: v1
kind: Service
metadata:
  name: houcem-service
spec:
  selector:
    app: houcem-tpfoyer
  ports:
    - protocol: TCP
      port: 8089
      targetPort: 8089
  type: LoadBalancer
